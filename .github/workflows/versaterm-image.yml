name: Versaterm image

# Builds the drachtio-server image from this fork's sources and publishes it to GHCR.
#   push to versaterm/main -> :versaterm-main and :sha-<short>
#   tag vX.Y.Z-vt.N        -> :vX.Y.Z-vt.N and :sha-<short>
#   pull request           -> build only (no push)

on:
  push:
    branches:
      - versaterm/main
    tags:
      - "v*-vt.*"
  pull_request:
    branches:
      - versaterm/main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: versaterm-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/versaterm-public-safety/drachtio-server

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (full history, tags and submodules for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=versaterm-main,enable=${{ github.ref == 'refs/heads/versaterm/main' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=drachtio-server (Versaterm fork)
            org.opencontainers.image.description=drachtio-server built from ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/versaterm/Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_CPUS=4
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint drachtio "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" --version

      - name: Summary
        run: |
          {
            echo "### drachtio-server image"
            echo ""
            echo "Version: \`$(git describe --tags --always)\`"
            echo ""
            echo "Digest: \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
